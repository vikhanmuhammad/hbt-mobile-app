name: habbit_tracker_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.1+13

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  drift: ^2.30.0
  # Pinned to the 0.5.x line: from 0.6.0+eol onward this package is a no-op
  # stub that expects sqlite3 v3.x's native-assets bundling. Our drift/drift_dev
  # versions (pinned below for riverpod_generator/analyzer compatibility) still
  # use sqlite3 v2.x, which needs 0.5.x's legacy Gradle-based .so bundling.
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^22.2.0
  intl: ^0.20.2
  timezone: ^0.11.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  flutter_dotenv: ^5.2.1
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  firebase_messaging: ^16.5.0
  cloud_functions: ^6.1.0
  in_app_purchase: ^3.2.5
  flutter_undraw: ^0.2.1
  flutter_animate: ^4.5.2
  health: ^12.2.0
  device_calendar: ^4.3.3
  permission_handler: ^12.0.1
  android_intent_plus: ^5.3.0
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  image: ^4.3.0

dependency_overrides:
  # device_calendar 4.x's own pubspec pins timezone ^0.9.0, which conflicts
  # with the ^0.11.1 the rest of this app (flutter_local_notifications
  # scheduling) needs. device_calendar only uses timezone for a couple of
  # narrow date/duration helpers that stayed API-compatible across that
  # range, so it's safe to force it onto the newer timezone the rest of the
  # app already depends on rather than downgrade everything else.
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: 2.30.1
  riverpod_generator: 4.0.3
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data/habit_templates.json
    - packages/flutter_undraw/assets/undraw/shared_goals.svg
    - packages/flutter_undraw/assets/undraw/chatting.svg
    - packages/flutter_undraw/assets/undraw/questions.svg
    - packages/flutter_undraw/assets/undraw/time_management.svg
    - packages/flutter_undraw/assets/undraw/feeling_proud.svg
    - assets/icon/icon_new.png
    - assets/background/form_page/composed.png
    - assets/background/questionare_1/11.png
    - assets/background/questionare_1/12.png
    - assets/background/questionare_1/13.png
    - assets/background/questionare_1/14.png
    - assets/background/questionare_2/7.png
    - assets/background/questionare_2/8.png
    - assets/background/questionare_2/9.png
    - assets/background/questionare_3/2.png
    - assets/background/questionare_3/3.png
    - assets/background/questionare_3/4.png
    - .env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
          weight: 400
        - asset: assets/fonts/Nunito.ttf
          weight: 500
        - asset: assets/fonts/Nunito.ttf
          weight: 600
        - asset: assets/fonts/Nunito.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_new.png"
  # icon_new.png has no background fill (transparent, foreground-only) and
  # is itself gold/yellow — a gold background behind it reads as a flat
  # blob with barely-visible contrast on the launcher, so white is used
  # instead to keep the checkmark shape legible. iOS (which rejects icons
  # with an alpha channel) needs its alpha flattened onto that same white.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_new.png"
